[project]
name = "efed-ocr-service"
version = "0.1.0"
description = "Serviço de OCR da federação (FastAPI). Fase 1: apenas a fundação; o reconhecimento chega na Fase 4."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
