# Pilha de PRODUÇÃO: proxy reverso, web, API, OCR, PostgreSQL, Redis, MinIO e backups.
#
#   docker compose up -d --build
#
# Antes de subir: copie .env.example para .env, troque TODOS os segredos e coloque o
# certificado TLS em infrastructure/nginx/certs (ver docs/02-arquitetura.md, "Implantação").
#
# Redes:
#   edge → tráfego de entrada e saída (proxy, web, API).
#   data → rede interna sem acesso à internet (bancos, armazenamento, OCR).
# Somente o proxy publica portas no host.

name: efed

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  proxy:
    image: nginx:1.27-alpine
    <<: [*restart, *logging]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?defina PUBLIC_HOSTNAME no .env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - acme-webroot:/var/www/acme:ro
    networks: [edge]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/healthz || exit 1']
      interval: 15s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    <<: [*restart, *logging]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:3001
    networks: [edge]

  # Aplica as migrations pendentes e encerra. A API só sobe depois que ele termina com sucesso.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    <<: *logging
    restart: 'no'
    working_dir: /repo/apps/api
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-efed}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-efed}?schema=public
    networks: [data]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: [*restart, *logging]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      # Um proxy confiável à frente (o Nginx); o web repassa o cabeçalho recebido dele.
      TRUST_PROXY_HOPS: 1
      OPENAPI_ENABLED: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER:-efed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-efed}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379
      S3_ENDPOINT: http://minio:9000
      ALLOWED_ORIGINS: https://${PUBLIC_HOSTNAME}
      PUBLIC_WEB_URL: https://${PUBLIC_HOSTNAME}
      SESSION_IDLE_TTL_MINUTES: ${SESSION_IDLE_TTL_MINUTES:-10080}
      SESSION_ABSOLUTE_TTL_DAYS: ${SESSION_ABSOLUTE_TTL_DAYS:-30}
      ADMIN_SESSION_IDLE_TTL_MINUTES: ${ADMIN_SESSION_IDLE_TTL_MINUTES:-120}
      CSRF_SECRET: ${CSRF_SECRET:?defina CSRF_SECRET no .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?defina MFA_ENCRYPTION_KEY no .env}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST no .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM no .env}
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-300}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
    networks: [edge, data]

  # Fase 1: apenas a fundação do serviço (saúde). O reconhecimento entra na Fase 4.
  ocr:
    build:
      context: services/ocr-service
    <<: [*restart, *logging]
    networks: [data]

  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-efed}
      POSTGRES_USER: ${POSTGRES_USER:-efed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10

  # Armazenamento compatível com S3 (avatares, escudos, evidências). Imagem: ADR 0009.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    <<: [*restart, *logging]
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-efed}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10

  # Backup lógico diário do PostgreSQL, com retenção. Restauração: infrastructure/backup/README.md
  backup:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/backup/backup-loop.sh']
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-efed}
      PGUSER: ${POSTGRES_USER:-efed}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infrastructure/backup/backup-loop.sh:/backup/backup-loop.sh:ro
      - ./infrastructure/backup/data:/backups
    networks: [data]

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  acme-webroot:
