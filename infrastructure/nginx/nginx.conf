worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logs estruturados, sem cookies nem corpo das requisições.
  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;
  error_log /var/log/nginx/error.log warn;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Limite maior quando o envio de capturas chegar (Fase 4), apenas na rota de upload.
  client_max_body_size 1m;

  # Defesa em profundidade: a API aplica seus próprios limites por IP (Redis).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
